name: Deploy web PWA to mouro.ai/gin-rummey

# Every push to master rebuilds the static Expo web export and rsyncs it to the
# NUC that hosts mouro.ai, under /home/rami/gin-rummey/ (served by nginx at
# https://mouro.ai/gin-rummey/). The one-time nginx location block is set up
# separately — see README "Web / PWA → Deploy to mouro.ai/gin-rummey".
#
# NOTE: this deploys the WEBSITE only. The installed iOS/Android native app is a
# separate channel (EAS) — a PWA and a native binary are different deliverables
# from the same codebase.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate: never deploy a build that doesn't typecheck or pass the engine tests.
      - run: npm run typecheck
      - run: npm test

      - name: Export static web build
        # The Firebase web config is baked into the JS bundle at export time.
        # These EXPO_PUBLIC_* values are public identifiers (security is enforced
        # by the Realtime Database rules, not by hiding them) — same values as the
        # local .env. Stored as repo secrets so the git-ignored .env isn't needed.
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: npx expo export --platform web

      - name: Deploy dist/ to the NUC via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # --delete prunes old content-hashed assets; --chmod makes everything
          # world-readable so nginx (www-data) can serve it regardless of umask.
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            dist/ "$SSH_USER@$SSH_HOST:/home/rami/gin-rummey/"
