    <rect x="311" y="207" width="98" height="98" rx="14" fill="#e3cba3"/>
    <rect x="103" y="311" width="98" height="98" rx="14" fill="#eedcbc"/>
    <rect x="207" y="311" width="98" height="98" rx="14" fill="#e3cba3"/>
    <rect x="311" y="311" width="98" height="98" rx="14" fill="#eedcbc"/>
