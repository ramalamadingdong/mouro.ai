      <stop offset="0" stop-color="#1f6f78"/>
      <stop offset="1" stop-color="#0b2429"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Floor: 3 × 3 tiles in a wooden frame -->
  <rect x="88" y="98" width="336" height="336" rx="34" fill="#000" opacity="0.28"/>
  <rect x="88" y="88" width="336" height="336" rx="34" fill="#7a4e2d"/>
