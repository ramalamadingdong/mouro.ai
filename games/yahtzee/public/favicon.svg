<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Yahtzee icon: an amber die with ears and whiskers; the five pips double as the cat's face. Full-bleed square with the artwork inside the central 80%, so the
       same file works as a maskable icon. Rendered to the PNGs beside it by
       scripts/render-icons.mjs (repo root). -->
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.2" r="1">
      <stop offset="0" stop-color="#2d3360"/>
      <stop offset="1" stop-color="#0e1020"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7bd52"/>
      <stop offset="1" stop-color="#e2952a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="131" y="186" width="250" height="250" rx="54" fill="#000" opacity="0.3" transform="translate(6 12)"/>
  <!-- ears -->
  <path d="M146 230 L154 98 L250 184 Z M366 230 L358 98 L262 184 Z" fill="#f0a830"/>
  <path d="M170 196 L174 134 L222 180 Z M342 196 L338 134 L290 180 Z" fill="#b8801f"/>
  <rect x="131" y="176" width="250" height="250" rx="54" fill="url(#die)"/>
  <!-- whiskers -->
  <g fill="none" stroke="#f2f0f7" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M124 300 L66 286 M124 320 L66 334 M388 300 L446 286 M388 320 L446 334"/>
  </g>
  <!-- pips: two eyes, a nose, two more to make the five -->
  <g fill="#2a1a05">
    <ellipse cx="192" cy="240" rx="21" ry="24"/>
    <ellipse cx="320" cy="240" rx="21" ry="24"/>
    <circle cx="256" cy="302" r="21"/>
    <circle cx="192" cy="364" r="21"/>
    <circle cx="320" cy="364" r="21"/>
  </g>
  <circle cx="199" cy="232" r="7" fill="#fff"/>
  <circle cx="327" cy="232" r="7" fill="#fff"/>
  <path d="M256 323 Q256 346 236 344 M256 323 Q256 346 276 344" fill="none" stroke="#2a1a05" stroke-width="7" stroke-linecap="round"/>
</svg>
