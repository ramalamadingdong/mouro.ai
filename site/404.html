    <!--
      The page Caddy answers with for any address that is not on the site
      (infra/Caddyfile → handle_errors). It can be served at ANY path, so every
      address in here is root-relative or absolute, never relative.

      Only this page's own pieces are styled here; the rest is site.css.
    -->
    <style>
        .lost {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 28px;
        }

        /* "404", with the cat sitting in for the zero. */
        .lost-number {
            display: flex;
            align-items: center;
            gap: 0.04em;
            font-size: clamp(6.5rem, 31vw, 19rem);
            font-weight: 800;
            line-height: 0.8;
            letter-spacing: -0.035em;
            margin: 0.1em 0 0 -0.045em;
            user-select: none;
        }

        .cat {
            flex: none;
            height: 0.86em;
            width: auto;
            margin: -0.12em 0.02em 0 0.05em;
            overflow: visible;
        }

        .cat-body { fill: var(--ink); }
        .cat-belly { fill: var(--ground); }
        .cat-eye { fill: var(--yellow); }
        .cat-pupil { fill: #16202b; }
        .cat-inner-ear { fill: var(--steel); }
        .cat-line {
            fill: none;
            stroke: var(--ground);
            stroke-width: 3;
            stroke-linecap: round;
        }
        .cat-tail {
            fill: none;
            stroke: var(--ink);
            stroke-width: 15;
            stroke-linecap: round;
            transform-origin: 150px 222px;
            animation: tail 3.2s ease-in-out infinite;
        }
        .cat-lids {
            fill: var(--ink);
            transform-box: fill-box;
            transform-origin: center top;
            transform: scaleY(0);
            animation: blink 5.5s infinite;
        }

        @keyframes tail {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-13deg); }
        }
        @keyframes blink {
            0%, 95.5%, 100% { transform: scaleY(0); }
            97.5% { transform: scaleY(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            .cat-tail, .cat-lids { animation: none; }
        }

        .lost h1 {
            font-size: clamp(1.9rem, 5vw, 3rem);
        }

        .lost-path {
            font-weight: 650;
            color: var(--ink);
            overflow-wrap: anywhere;
        }
    </style>
    <!-- Analytics (self-hosted Umami, cookieless): see site/static/js/analytics.js -->

<section class="lost">

    <h1>This page wandered off.</h1>

        The cat has looked under everything and is done looking.
    </p>

    </main>
    <script>
        // Name the address that was asked for. textContent, never innerHTML:
        // the path is whatever somebody typed.
        (function () {
            var path = decodeURI(location.pathname);
            if (path.length > 60) path = path.slice(0, 57) + '…';
            document.getElementById('lost-path').textContent = path;
        })();

        // The cat watches the pointer (or the last place a finger touched).
        (function () {
            var cat = document.getElementById('cat');
            var pupils = cat.querySelectorAll('.cat-pupil');
            var REACH = 9; // how far a pupil may travel inside its eye, in SVG units
            addEventListener('pointermove', look, { passive: true });
            addEventListener('pointerdown', look, { passive: true });
            function look(e) {
                var box = cat.getBoundingClientRect();
                if (!box.width) return;
                var scale = 200 / box.width;
                for (var i = 0; i < pupils.length; i++) {
                    var cx = pupils[i].cx.baseVal.value;
                    var cy = pupils[i].cy.baseVal.value;
                    var dx = (e.clientX - box.left) * scale - cx;
                    var dy = (e.clientY - box.top) * scale - cy;
                    var far = Math.hypot(dx, dy) || 1;
                    var go = Math.min(REACH, far / 12);
                    pupils[i].setAttribute('transform', 'translate(' + (dx / far) * go + ' ' + (dy / far) * go * 0.6 + ')');
                }
            }
        })();
    </script>
