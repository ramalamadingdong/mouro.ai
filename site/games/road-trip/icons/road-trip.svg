<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Road Trip icon: a road running to the horizon under a low sun, with a map pin over it. Full-bleed square, artwork
       inside the central 80% (maskable safe zone). Rendered to the PNGs beside it by scripts/render-icons.mjs. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a52"/>
      <stop offset="0.55" stop-color="#3f6b7c"/>
      <stop offset="1" stop-color="#f0a25a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="300" r="74" fill="#f8d36a"/>
  <!-- Hills -->
  <path d="M0 300 Q110 236 210 290 Q300 250 380 282 Q450 258 512 284 V512 H0 Z" fill="#2c5a4a"/>
  <path d="M0 330 Q140 290 256 318 Q380 292 512 326 V512 H0 Z" fill="#1d4236"/>
  <!-- Road -->
  <path d="M236 318 H276 L420 512 H92 Z" fill="#262e3a"/>
  <path d="M236 318 H276 L420 512 H92 Z" fill="none" stroke="#e8e2d2" stroke-width="6" stroke-linejoin="round" opacity="0.8"/>
  <g fill="#f4c542">
    <path d="M253 330 h6 l2 22 h-10 z"/>
    <path d="M250 372 h12 l3 34 h-18 z"/>
    <path d="M246 432 h20 l5 54 h-30 z"/>
  </g>
  <!-- Map pin -->
  <g transform="translate(256 168)">
    <ellipse cx="0" cy="104" rx="26" ry="8" fill="#000" opacity="0.25"/>
    <path d="M0 96 C-22 60 -62 30 -62 -10 A62 62 0 0 1 62 -10 C62 30 22 60 0 96 Z" fill="#ff6b57" stroke="#9b2c1f" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="-12" r="24" fill="#fff4e2"/>
  </g>
</svg>
