<!--
  Road Trip used to be one page here. It is now three games (trivia/, photo/,
  categories/) listed on the games hub's "Road trip games" tab. This address
  keeps old links working: car-screen invites (?join=CODE) go to Categories,
  everything else to the hub tab. app.css and app.js beside it are shared by
  the three games.
-->
<meta http-equiv="refresh" content="0; url=/games/#road-trip">
<script>
  (() => {
    const join = new URLSearchParams(location.search).get("join");
    location.replace(join ? `/games/road-trip/categories/?join=${encodeURIComponent(join)}` : "/games/#road-trip");
  })();
</script>
