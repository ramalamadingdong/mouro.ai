<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Home Price Guess icon: a house with a price tag beside the road. Full-bleed square, artwork
       inside the central 80% (maskable safe zone). Rendered to the PNGs beside it by scripts/render-icons.mjs. -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#2f7a5c"/>
      <stop offset="1" stop-color="#10291f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Hills -->
  <path d="M52 392 Q140 300 236 352 Q330 290 460 360 V392 Z" fill="#1d4d3a"/>
  <!-- Road -->
  <rect x="64" y="388" width="384" height="44" rx="10" fill="#262e3a"/>
  <g fill="#f4c542"><rect x="96" y="406" width="44" height="8" rx="4"/><rect x="176" y="406" width="44" height="8" rx="4"/><rect x="256" y="406" width="44" height="8" rx="4"/><rect x="336" y="406" width="44" height="8" rx="4"/></g>
  <!-- House -->
  <g transform="translate(96 150)">
    <rect x="150" y="18" width="30" height="64" rx="4" fill="#8a3a2e"/>
    <path d="M28 120 L120 38 L212 120" fill="none" stroke="#c9503d" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 116 L120 54 L192 116 V238 H48 Z" fill="#fff4dc"/>
    <rect x="102" y="170" width="38" height="68" rx="5" fill="#2f7a5c"/>
    <circle cx="131" cy="206" r="4" fill="#f4c542"/>
    <rect x="64" y="134" width="34" height="30" rx="4" fill="#5fd0c0"/>
    <rect x="144" y="134" width="34" height="30" rx="4" fill="#5fd0c0"/>
  </g>
  <!-- Price tag -->
  <g transform="translate(330 176) rotate(14)">
    <path d="M0 -40 L56 -40 Q68 -40 68 -28 V96 Q68 108 56 108 H0 Q-12 108 -12 96 V-28 Q-12 -40 0 -40 Z" fill="#f4c542" stroke="#a9851f" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="28" cy="-16" r="9" fill="#10291f"/>
    <path d="M28 -16 Q10 -70 -30 -84" fill="none" stroke="#fff4dc" stroke-width="5" stroke-linecap="round"/>
    <text x="28" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#10291f">$</text>
  </g>
</svg>
