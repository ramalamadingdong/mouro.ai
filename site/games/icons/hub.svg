<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mouro Games hub icon. Full-bleed square; the artwork stays inside the
       central 80% so the same file works as a maskable icon. Rendered to the
       PNGs beside it by scripts/render-icons.mjs. -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#2b4a3d"/>
      <stop offset="1" stop-color="#101a16"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7bd52"/>
      <stop offset="1" stop-color="#e2952a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- playing card -->
  <g transform="rotate(-14 210 250)">
    <rect x="118" y="112" width="176" height="252" rx="22" fill="#000" opacity="0.28" transform="translate(6 10)"/>
    <rect x="118" y="112" width="176" height="252" rx="22" fill="#f5f0e1"/>
    <path d="M206 168c-34 40-54 58-54 84 0 20 15 34 33 34 8 0 15-3 20-8-2 14-8 24-17 32h36c-9-8-15-18-17-32 5 5 12 8 20 8 18 0 33-14 33-34 0-26-20-44-54-84z" fill="#7c2d3a"/>
  </g>
  <!-- die -->
  <g transform="rotate(10 322 318)">
    <rect x="238" y="234" width="168" height="168" rx="36" fill="#000" opacity="0.3" transform="translate(6 10)"/>
    <rect x="238" y="234" width="168" height="168" rx="36" fill="url(#die)"/>
    <g fill="#2a1a05">
      <circle cx="280" cy="276" r="15"/>
      <circle cx="364" cy="276" r="15"/>
      <circle cx="322" cy="318" r="15"/>
      <circle cx="280" cy="360" r="15"/>
      <circle cx="364" cy="360" r="15"/>
    </g>
  </g>
</svg>
